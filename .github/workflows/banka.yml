name: Rakip banka araştırması

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  banka:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Gerekli paketler
        run: pip install --quiet cryptography
      - name: Banka bilgilerini topla
        run: python3 scripts/banka_tara3.py
      - name: Kaydet
        run: |
          git config user.name "mubbo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/banka_ham3.json
          git diff --cached --quiet && exit 0
          git commit -m "Rakip banka bilgileri toplandı"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1
