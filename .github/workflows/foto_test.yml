name: Fotoğrafla arama testi
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Paketler
        run: pip install --quiet onnxruntime pillow numpy cryptography
      - name: Test
        run: |
          python3 scripts/foto_test.py > data/foto_test_sonuc.txt 2>&1 || true
          tail -5 data/foto_test_sonuc.txt
          git config user.name "mubbo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/foto_test_sonuc.txt && git commit -m "Fotoğrafla arama testi sonucu" && for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
