name: Haftalık rapor (Telegram)

# Her pazartesi sabahı geçen haftanın rakip özetini Telegram botuyla gönderir. Claude kullanmaz, ücretsizdir.
on:
  workflow_dispatch:
  schedule:   # pazartesi 09.10'dan sonra birkaç deneme, ilk çalışan gönderir
    - cron: '10 6 * * 1'
    - cron: '47 6 * * 1'
    - cron: '23 7 * * 1'
    - cron: '13 8 * * 1'
    - cron: '43 9 * * 1'

permissions:
  contents: write

jobs:
  gonder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Gerekli paketler
        run: pip install --quiet cryptography pillow numpy
      - name: Raporu gönder
        env:
          MUBBO_SIFRE: ${{ secrets.MUBBO_SIFRE }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ]; then echo "TG_BOT_TOKEN yok"; exit 0; fi
          HAFTA=$(TZ=Europe/Istanbul date +%G-%V)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(cat data/hafta_gonderildi.txt 2>/dev/null)" = "$HAFTA" ]; then echo "Bu haftanın raporu zaten gönderildi"; exit 0; fi
          python3 scripts/telegram_hafta.py
          echo "$HAFTA" > data/hafta_gonderildi.txt
          git config user.name "mubbo-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hafta_gonderildi.txt; git commit -m "Haftalık rapor gönderildi" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && exit 0; sleep 7; done
