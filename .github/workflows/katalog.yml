name: Rakip katalog yenileme

on:
  workflow_dispatch:
    inputs:
      markalar:
        description: 'Sadece bu markalar (boşlukla ayrılmış anahtarlar); boşsa hepsi'
        required: false
        default: ''
      emb_sure:
        description: 'Görüntü vektörleri için en fazla dakika'
        required: false
        default: '150'
  schedule:
    - cron: '30 13 * * *'   # 16.30 TR: 19.00'a hazır

permissions:
  contents: write

concurrency:
  group: katalog
  cancel-in-progress: false

jobs:
  katalog:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: Gerekli paketler
        run: pip install --quiet cryptography pillow
      - name: Katalogları çek
        run: python3 scripts/katalog.py ${{ github.event.inputs.markalar }}
      - name: Kaydet
        run: |
          git config user.name "mubbo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/katalog data/katalog_durum.json data/kimg_var.json data/kur_*.json
          [ -f data/kimg_ek.json ] && git add data/kimg_ek.json data/kimg_ek
          git diff --cached --quiet && exit 0
          git commit -m "Rakip katalog yenileme"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1
      - name: Görüntü vektörleri (fotoğrafla arama)
        if: ${{ always() }}
        env:
          EMB_SURE: ${{ github.event.inputs.emb_sure || '150' }}
        run: |
          pip install --quiet onnxruntime numpy pillow
          python3 scripts/gomme.py /tmp/emb_is.json
      - name: Vektörleri kaydet
        if: ${{ always() }}
        run: |
          git config user.name "mubbo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -d data/emb ] && git add data/emb data/emb_durum.json
          git diff --cached --quiet && exit 0
          git commit -m "Fotoğrafla arama vektörleri"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1
