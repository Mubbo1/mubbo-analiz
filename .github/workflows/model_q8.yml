name: Model küçült (8 bit)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  q8:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Paketler
        run: pip install --quiet onnx onnxruntime
      - name: Küçült
        run: |
          python3 - <<'PY'
          from onnxruntime.quantization import quantize_dynamic, QuantType
          quantize_dynamic('model/gorsel.onnx', 'model/gorsel_q8.onnx', weight_type=QuantType.QUInt8)
          import os; print(os.path.getsize('model/gorsel_q8.onnx'))
          PY
      - name: Kaydet
        run: |
          git config user.name "mubbo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model/gorsel_q8.onnx && git commit -m "Görsel model 8 bit" && for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
