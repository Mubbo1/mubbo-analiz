name: Reklamları siteye işle

# Toplayıcının (reklam.yml) bulduğu yeni reklamları sitedeki reklam dosyalarına ekler.
# Şifreli dosyaları açmak için depo sırrı MUBBO_SIFRE gerekir (Settings > Secrets and variables > Actions).
on:
  workflow_dispatch:
  schedule:
    - cron: '41 15 * * *'   # her gün 18.41 TR

permissions:
  contents: write

concurrency:
  group: depo-yaz
  cancel-in-progress: false

jobs:
  isle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Gerekli paketler
        run: pip install --quiet cryptography pillow
      - name: Yeni reklamları ekle
        env:
          MUBBO_SIFRE: ${{ secrets.MUBBO_SIFRE }}
        run: |
          if [ -z "$MUBBO_SIFRE" ]; then echo "MUBBO_SIFRE sırrı tanımlı değil"; exit 1; fi
          python3 scripts/reklam_birlestir.py
      - name: Kaydet
        run: |
          git config user.name "mubbo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # yeni reklam eklenmediyse şifreli dosyaları yeniden yazma (depo şişmesin)
          if git diff --quiet -- data/reklam_eklenen.json; then
            echo "Yeni reklam yok"; cp data/reklam_durum.json /tmp/durum.json; git checkout -- data; git clean -fdq data; cp /tmp/durum.json data/reklam_durum.json
            git add data/reklam_durum.json; git commit -m "Reklam kontrolü: yeni reklam yok" || exit 0
            for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done; exit 1
          fi
          git add -A data/reklam_[0-9]*.bin data/reklam_ozet.bin data/reklam_eklenen.json data/reklam_durum.json
          git commit -m "Rakip reklamları siteye işlendi"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1
