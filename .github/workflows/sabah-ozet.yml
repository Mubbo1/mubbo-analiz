name: Sabah özeti (Telegram)

# Her sabah rakip özetini Telegram botuyla gönderir. Claude kullanmaz, ücretsizdir.
# Gereken sırlar (Settings > Secrets and variables > Actions): MUBBO_SIFRE, TG_BOT_TOKEN (TG_CHAT_ID isteğe bağlı).
# TG_BOT_TOKEN tanımlı değilse hiçbir şey göndermez.
on:
  workflow_dispatch:
  schedule:   # GitHub zamanlanmış işleri bazen saatlerce geciktirip bazen hiç çalıştırmıyor: 09.00'dan sonra birkaç deneme, ilk çalışan gönderir
    - cron: '0 6 * * *'
    - cron: '17 6 * * *'
    - cron: '41 6 * * *'
    - cron: '7 7 * * *'
    - cron: '33 7 * * *'
    - cron: '3 8 * * *'
    - cron: '37 9 * * *'
    - cron: '11 11 * * *'

permissions:
  contents: write

jobs:
  gonder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Gerekli paketler
        run: pip install --quiet cryptography pillow numpy
      - name: Özeti gönder
        env:
          MUBBO_SIFRE: ${{ secrets.MUBBO_SIFRE }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ]; then echo "Telegram sırları henüz eklenmedi; atlanıyor."; exit 0; fi
          BUGUN=$(TZ=Europe/Istanbul date +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(cat data/sabah_gonderildi.txt 2>/dev/null)" = "$BUGUN" ]; then echo "Bugünün raporu zaten gönderildi"; exit 0; fi
          python3 scripts/telegram_ozet.py
          echo "$BUGUN" > data/sabah_gonderildi.txt
      - name: Kaydet
        run: |
          if git status --porcelain data/tg_sohbet.bin data/sabah_gonderildi.txt | grep -q .; then
            git config user.name "mubbo-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/tg_sohbet.bin data/sabah_gonderildi.txt; git commit -m "Sabah raporu gönderildi"
            for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && exit 0; sleep 7; done
          fi
