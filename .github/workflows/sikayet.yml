name: Rakip şikayetleri (Şikayetvar)

# Şikayetvar GitHub sunucularını engellediği için otomatik çalışmıyor; yalnız elle denemek için.
# Rakiplerin Şikayetvar puanı, şikâyet sayısı, son şikâyetleri ve konuları. Claude kullanmaz, ücretsizdir.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: depo-yaz
  cancel-in-progress: false

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Gerekli paketler
        run: pip install --quiet cryptography pillow numpy
      - name: Şikayetvar'ı oku
        env:
          MUBBO_SIFRE: ${{ secrets.MUBBO_SIFRE }}
        run: python3 scripts/sikayet.py
      - name: Kaydet
        run: |
          git config user.name "mubbo-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sikayet_durum.bin data/sikayet_sayfalar.json
          git commit -m "Şikayet taraması" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && exit 0; sleep 7; done; exit 1
