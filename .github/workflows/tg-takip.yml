name: Takip listesi (Telegram)

# Bota gelen takip isteklerini işler (15 dakikada bir) ve katalog yenilenince takip edilen ürünlerin
# fiyat / stok değişikliklerini Telegram'dan bildirir. Claude kullanmaz, ücretsizdir.
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  workflow_run:   # 15 dakikalık zamanlayıcı GitHub'da güvenilir değil: saatlik yeni ürün ve telegram işlerinden sonra da çalışır
    workflows: ['Rakip katalog yenileme', 'Rakip yeni ürün kontrolü', 'Telegram toptancı paylaşımları']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: tg-takip
  cancel-in-progress: false

jobs:
  takip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Gerekli paketler
        run: pip install --quiet cryptography pillow numpy
      - name: Takip
        env:
          MUBBO_SIFRE: ${{ secrets.MUBBO_SIFRE }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ]; then echo "TG_BOT_TOKEN yok"; exit 0; fi
          if [ "${{ github.event.workflow_run.name }}" = "Rakip katalog yenileme" ]; then python3 scripts/tg_takip.py --kontrol; else python3 scripts/tg_takip.py; fi
      - name: Kaydet
        run: |
          if git status --porcelain data/tg_takip.bin | grep -q .; then
            git config user.name "mubbo-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/tg_takip.bin; git commit -m "Takip listesi güncellendi"
            for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && exit 0; sleep 7; done; exit 1
          fi
